name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check public files
        run: python tools/check_public_files.py
      - name: Test with isolated local state (no network credentials)
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'elf-test-appdata'
          $env:ELF_HOME = Join-Path $env:LOCALAPPDATA 'LineWorkElf'
          $env:ELF_STATE_DIR = Join-Path $env:ELF_HOME 'state'
          New-Item -ItemType Directory -Path $env:ELF_STATE_DIR -Force | Out-Null
          python -m unittest discover -s . -p 'test_*.py' -q

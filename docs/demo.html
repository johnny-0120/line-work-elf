<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>摘要示範｜公事小精靈</title><link rel="stylesheet" href="demo.css"><script src="demo.js" defer></script></head><body><main><header><p class="eyebrow">LINE WORK ELF · 合成資料示範 · 沒有任何真實對話</p><h1>把對話，讀成下一步。</h1><p>完整摘要、討論脈絡與待辦，在這裡慢慢看。</p></header><section id="gate"><h2>先看看整理長什麼樣</h2><p>這一頁只有合成示範，不會連接你的 LINE 或日曆。正式摘要需從 LINE 取得個人短效入口。</p><button id="enter">開啟合成示範</button><p id="error" role="status"></p></section><div id="workspace" hidden><div class="toolbar"><div><button id="refresh">更新內容</button><button id="logout" class="secondary">回到產品介紹</button></div><p id="status" role="status"></p></div><section class="stats" aria-label="整理概況"><div><strong id="summaryCount">0</strong><span>份整理</span></div><div><strong id="taskCount">0</strong><span>項待辦</span></div><div><strong id="pendingCount">0</strong><span>份處理中</span></div></section><nav aria-label="內容分類"><button data-filter="all" aria-pressed="true">全部整理</button><button data-filter="work" class="secondary" aria-pressed="false">工作群組</button><button data-filter="conversation" class="secondary" aria-pressed="false">貼上的對話</button></nav><label class="search">找這次想看的事<input id="search" type="search" placeholder="搜尋摘要與待辦文字" maxlength="100"></label><div class="columns"><section><h2>對話重點</h2><div id="summaries"></div></section><aside><h2>接著要處理</h2><p class="muted">依對話推測，請確認是否已回覆。完成、保存與新增日曆請回 LINE 操作。</p><div id="tasks"></div><a id="back" href="https://line.me/R/ti/p/%40526byspu">回到 LINE 小精靈</a></aside></div></div><footer>閱讀網頁不會重新呼叫 AI，也不會發送 LINE 推播。工作摘要保留約七天，貼上對話約二十四小時。請勿在共用裝置留下頁面。</footer></main></body></html>
